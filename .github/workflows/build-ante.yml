name: Build Ante

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-ante-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.app }} - ${{ matrix.target }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            app: ante-acp
            artifact: ante-acp-linux-x64

          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            app: ante-gateway
            artifact: ante-gateway-linux-x64

          # macOS Intel x64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            app: ante-acp
            artifact: ante-acp-darwin-x64

          - os: macos-15-intel
            target: x86_64-apple-darwin
            app: ante-gateway
            artifact: ante-gateway-darwin-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.app }}
          shared-key: ${{ matrix.app }}-${{ matrix.target }}

      - name: Build
        shell: bash
        run: |
          cargo build \
            --release \
            --locked \
            --manifest-path "${{ matrix.app }}/Cargo.toml" \
            --target "${{ matrix.target }}"

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist

          cp "${{ matrix.app }}/target/${{ matrix.target }}/release/${{ matrix.app }}" \
             "dist/${{ matrix.artifact }}"

          chmod +x "dist/${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
